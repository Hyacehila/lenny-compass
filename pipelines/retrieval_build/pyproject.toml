[project]
name = "retrieval-build"
version = "0.1.0"
description = "Build and query the local SQLite lexical and semantic retrieval indexes"
requires-python = "==3.11.*"
dependencies = [
    "ai-pm-contracts",
    "httpx>=0.28,<0.29",
    "pydantic>=2.11,<3",
    "sqlite-vec==0.1.9",
]

[project.scripts]
retrieval-build = "retrieval_build.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_build"]

[tool.uv.sources]
ai-pm-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
