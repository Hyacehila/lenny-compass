[project]
name = "ai-pm-contracts"
version = "0.1.0"
description = "Shared, versioned contracts for the AI-PM knowledge and retrieval layers"
requires-python = "==3.11.*"
dependencies = [
    "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_pm_contracts"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]
