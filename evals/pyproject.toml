[project]
name = "ai-pm-evals"
version = "0.1.0"
description = "Deterministic offline evaluation contracts and quality gates for AI-PM"
requires-python = "==3.11.*"
dependencies = [
    "pydantic>=2.11,<3",
]

[project.scripts]
ai-pm-eval = "ai_pm_evals.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_pm_evals"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
